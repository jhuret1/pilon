<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">PILON — Your catalog has blind spots.</title>
  <desc id="desc">PILON turns customer demand into evidence-backed catalog changes. A Home Depot request for gnat killer reveals a missing Gnats value and a missing pest control action attribute. A product description supplies the evidence. Changes are proposed, not published.</desc>
  <rect width="1280" height="650" fill="#18201b" />
  <g fill="#d6f56a">
    <path d="M40 35h8v34h-8zm13 0h8v24h-8zm13 0h8v14h-8z" />
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="88" y="61" fill="#f6f5ed" font-size="29" font-weight="800" letter-spacing="1" font-family="Arial">PILON</text>
    <text x="1236" y="57" text-anchor="end" fill="#adb9ae" font-size="12" letter-spacing="2" font-family="Arial">OPEN SOURCE / DEMAND → DATA</text>
    <path d="M40 91h1200" stroke="#3e483e" />
    <text x="40" y="140" fill="#d6f56a" font-size="12" font-weight="700" letter-spacing="2" font-family="Arial">THE NEXT CHANGE STARTS WITH A QUESTION.</text>
    <g fill="#f6f5ed" font-size="72" font-weight="700" letter-spacing="-3.5">
      <text x="36" y="230" font-family="Arial" fill="#f6f5ed" font-size="72" font-weight="700" letter-spacing="-3.5">Your catalog</text>
      <text x="36" y="310" font-family="Arial" fill="#f6f5ed" font-size="72" font-weight="700" letter-spacing="-3.5">has blind spots.</text>
    </g>
    <g fill="#c2cbc0" font-size="20">
      <text x="40" y="365" font-family="Arial" fill="#c2cbc0" font-size="20">Turn customer demand into</text>
      <text x="40" y="394" font-family="Arial" fill="#c2cbc0" font-size="20">evidence-backed catalog changes.</text>
    </g>
    <rect x="40" y="446" width="320" height="48" fill="#d6f56a" rx="4" />
    <text x="60" y="476" fill="#18201b" font-size="16" font-family="Consolas">$ pilon start --demo</text>
    <text x="40" y="521" fill="#adb9ae" font-size="13" font-family="Arial">Runs locally. Try the demo without an API key.</text>
    <g transform="translate(672 126)">
      <rect width="568" height="409" rx="8" fill="#f5f4ec" />
      <text x="26" y="34" fill="#536151" font-size="10" letter-spacing="1.5" font-weight="700" font-family="Arial">WORKED EXAMPLE / HOME DEPOT</text>
      <rect x="26" y="53" width="516" height="61" rx="4" fill="white" stroke="#d6d9cd" />
      <circle cx="48" cy="82" r="6" fill="none" stroke="#6b7767" stroke-width="1.5" />
      <path d="m52 87 5 5" stroke="#6b7767" stroke-width="1.5" />
      <text x="71" y="92" fill="#18201b" font-size="26" font-weight="700" font-family="Arial">gnat killer</text>
      <text x="26" y="149" fill="#6a7566" font-size="11" letter-spacing="1" font-family="Arial">CUSTOMER ASKS FOR</text>
      <text x="299" y="149" fill="#6a7566" font-size="11" letter-spacing="1" font-family="Arial">CATALOG CHANGE</text>
      <path d="M26 160h516" stroke="#d5d9cc" />
      <text x="26" y="190" fill="#18201b" font-size="17" font-family="Arial">Which pest?</text>
      <text x="252" y="190" fill="#536151" font-size="18" font-family="Arial">→</text>
      <rect x="290" y="170" width="252" height="32" rx="3" fill="#e4edce" />
      <text x="301" y="191" fill="#284522" font-size="15" font-weight="700" font-family="Arial">+ Gnats</text>
      <text x="536" y="191" fill="#536151" text-anchor="end" font-size="10" font-family="Arial">VALUE</text>
      <text x="26" y="237" fill="#18201b" font-size="17" font-family="Arial">What does it do?</text>
      <text x="252" y="237" fill="#536151" font-size="18" font-family="Arial">→</text>
      <rect x="290" y="217" width="252" height="32" rx="3" fill="#e4edce" />
      <text x="301" y="238" fill="#284522" font-size="15" font-weight="700" font-family="Arial">+ Control action</text>
      <text x="536" y="238" fill="#536151" text-anchor="end" font-size="10" font-family="Arial">ATTRIBUTE</text>
      <rect x="26" y="272" width="516" height="105" rx="4" fill="#18201b" />
      <text x="42" y="296" fill="#d6f56a" font-size="10" letter-spacing="1" font-family="Arial">PRODUCT EVIDENCE</text>
      <text x="42" y="323" fill="#f5f4ec" font-size="15" font-family="Arial">“exterminates flies, mosquitoes, gnats”</text>
      <text x="42" y="351" fill="#adb9ae" font-size="11" font-family="Arial">Source: product 143379 · proposed value: kill</text>
      <text x="540" y="399" text-anchor="end" fill="#6b7567" font-size="10" font-family="Arial">AGENT-REVIEWED EXAMPLE · NOT PUBLISHED</text>
    </g>
    <path d="M40 568h1200" stroke="#3e483e" />
    <text x="40" y="611" fill="#f5f4ec" font-size="15" font-weight="700" font-family="Arial">BENCHMARK</text>
    <text x="161" y="611" fill="#adb9ae" font-size="14" font-family="Arial">Find the gap</text>
    <text x="376" y="611" fill="#d6f56a" font-size="20" font-family="Arial">→</text>
    <text x="452" y="611" fill="#f5f4ec" font-size="15" font-weight="700" font-family="Arial">EXTRACT</text>
    <text x="542" y="611" fill="#adb9ae" font-size="14" font-family="Arial">Find the evidence</text>
    <text x="800" y="611" fill="#d6f56a" font-size="20" font-family="Arial">→</text>
    <text x="870" y="611" fill="#f5f4ec" font-size="15" font-weight="700" font-family="Arial">INDUCT</text>
    <text x="950" y="611" fill="#adb9ae" font-size="14" font-family="Arial">Review the change</text>
  </g>
</svg>
