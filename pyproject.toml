[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pilon-discovery"
version = "0.3.0a1"
description = "Turn unmet customer demand into grounded, versioned product knowledge in the background"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PILON contributors"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.urls]
Repository = "https://github.com/jhuret1/pilon"
Issues = "https://github.com/jhuret1/pilon/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.14,<1"]

[project.scripts]
pilon = "pilon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pilon = ["facets/example/*.json", "facets/example/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F821", "F822", "F823", "E9"]
