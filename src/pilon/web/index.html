<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PILON</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/">pilon<span class="brand-dot"></span></a><label for="runs">EXPÉRIENCE</label><select id="runs"></select><nav aria-label="Navigation"><button class="active" data-tab="ontology">Ontologie</button><button data-tab="evidence">Sources</button><button data-tab="performance">Exécution</button></nav><div class="sidebar-bottom"><span class="status-dot"></span> Local <span class="muted">/ research alpha</span></div></aside>
<main><header><div><p class="eyebrow">WORKSPACE</p><h1 id="page-title">Ontologie</h1></div><button id="download">Exporter JSON ↗</button></header><div id="notice" role="status">Chargement…</div><section id="stats" class="stats" aria-label="Indicateurs"></section>
<section id="ontology" class="view"><div class="toolbar"><div class="segmented"><button id="map-mode" class="active" aria-pressed="true">Carte</button><button id="list-mode" aria-pressed="false">Liste</button></div><input id="query" type="search" placeholder="Rechercher un concept…" aria-label="Rechercher un concept"><span id="count"></span></div>
<div class="workspace" id="workspace"><div><div id="map-panel" class="map-panel"><div class="map-heading"><span>Familles <span class="muted">/</span> concepts <span class="muted">/</span> valeurs observées</span><button id="fullscreen" title="Agrandir la carte">Agrandir ⤢</button></div><div id="graph" class="graph" aria-label="Carte de l’ontologie"></div><div class="map-bottom"><span>Glisser pour déplacer · Cliquer pour explorer</span><div><button id="zoom-out" aria-label="Dézoomer">−</button><button id="fit">Recentrer</button><button id="zoom-in" aria-label="Zoomer">+</button></div></div></div><div id="concepts" class="concepts" hidden></div></div><aside id="detail" class="detail"><p>Sélectionnez un concept.</p></aside></div></section>
<section id="evidence" class="view" hidden><div id="assertions"></div></section><section id="performance" class="view" hidden><h2>Répartition</h2><div id="routes"></div><h2>Appels et coûts</h2><div id="costs"></div></section><footer>Concepts candidats · Qualité non évaluée</footer></main></body></html>
