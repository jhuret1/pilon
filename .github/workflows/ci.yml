name: offline-checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python scripts/check_release.py
      - run: python -m pytest -q
      - run: pilon demo --no-serve
      - run: python -m build
      - name: Verify wheel contains the demo and viewer
        run: python scripts/check_wheel.py
  provider-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,openrouter]"
      - run: python -m pytest tests/test_providers.py -q
