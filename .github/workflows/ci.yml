name: discovery
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python scripts/check_release.py
      - run: python -m pytest -q
      - run: pilon demo
      - run: pilon loop demo
      - run: pilon loop demo --new-source --html runtime/loop-new.html --output runtime/loop-new.json
      - run: python -S -m src.pilon loop demo --db runtime/no-install.sqlite --html runtime/no-install.html --output runtime/no-install.json
      - run: python -m build
      - run: python scripts/check_wheel.py
